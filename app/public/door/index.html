<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Door tablet · SAMPLE Little Harbour Child Care (demo)</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/door/door.css">
</head>
<body class="door">
  <header id="door-head" class="door-head" data-sticky-header>
    <div class="door-bar">
      <p class="centre"><span id="centre-name" class="centre-name">SAMPLE Little Harbour Child Care (demo)</span>
        <span id="sample-badge" class="sample-badge">SAMPLE</span></p>
      <p class="door-clock"><span id="date-line"></span> <span id="time-line" class="door-time"></span></p>
    </div>
    <nav id="chips" class="chips" aria-label="Rooms" hidden></nav>
  </header>
  <main id="app" class="door-main"><p class="empty">Loading…</p></main>
  <p id="offline" class="offline" role="status" hidden></p>
  <script type="module" src="/door/door.js"></script>
</body>
</html>
