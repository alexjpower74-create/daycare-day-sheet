<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Room view · SAMPLE Little Harbour Child Care (demo)</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="room-page">
  <div class="aurora" aria-hidden="true"></div>
  <header class="topbar" data-sticky-header>
    <div class="topbar-inner">
      <div class="topbar-main">
        <p class="centre"><span class="centre-name" id="centre-name">SAMPLE Little Harbour Child Care (demo)</span> <span class="sample-badge">SAMPLE</span></p>
        <p class="topbar-meta"><span id="date-label"></span><span id="me-name"></span></p>
      </div>
      <button type="button" id="signout" class="btn btn-quiet no-print" hidden>Sign out</button>
    </div>
  </header>
  <main id="app" class="page"></main>
  <div id="toast-home" class="toast-home"></div>
  <script type="module" src="/room/room.js"></script>
</body>
</html>
